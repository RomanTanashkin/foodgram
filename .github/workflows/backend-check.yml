name: Foodgram checks

on:
  push:
    branches:
      - develop/backend-foundation
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8

      - name: Django system checks
        run: python backend/manage.py check

      - name: Check migrations
        run: python backend/manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python backend/manage.py migrate

      - name: Import ingredients
        run: python backend/manage.py import_ingredients

      - name: Seed tags for API checks
        run: |
          python backend/manage.py shell -c "from recipes.models import Tag; [Tag.objects.get_or_create(name=name, slug=slug) for name, slug in [('Завтрак', 'breakfast'), ('Обед', 'lunch'), ('Ужин', 'dinner')]]"

      - name: Start Django API
        run: |
          python backend/manage.py runserver 127.0.0.1:8000 > /tmp/foodgram-django.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/api/tags/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/foodgram-django.log
          exit 1

      - name: Run Postman collection
        run: |
          npx --yes newman run postman_collection/foodgram.postman_collection.json \
            --env-var baseUrl=http://127.0.0.1:8000

      - name: Show Django log on failure
        if: failure()
        run: cat /tmp/foodgram-django.log || true

      - name: Run Django tests
        run: python backend/manage.py test

      - name: Check PEP 8
        run: flake8 backend --config=setup.cfg

  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare environment
        run: cp infra/.env.example infra/.env

      - name: Validate Compose configuration
        run: docker compose -f infra/docker-compose.yml config

      - name: Build and start stack
        run: docker compose -f infra/docker-compose.yml up -d --build

      - name: Wait for application
        run: |
          for attempt in {1..60}; do
            if curl -fsS http://localhost/api/tags/ > /dev/null \
              && curl -fsS http://localhost/api/docs/ > /dev/null \
              && curl -fsS http://localhost/ > /dev/null; then
              docker compose -f infra/docker-compose.yml ps
              exit 0
            fi
            sleep 2
          done
          docker compose -f infra/docker-compose.yml ps
          docker compose -f infra/docker-compose.yml logs
          exit 1

      - name: Verify three long-running services
        run: |
          test "$(docker compose -f infra/docker-compose.yml ps --status running --services | wc -l)" -eq 3
          test "$(docker compose -f infra/docker-compose.yml ps --status exited --services | grep -c '^frontend$')" -eq 1

      - name: Stop stack
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
