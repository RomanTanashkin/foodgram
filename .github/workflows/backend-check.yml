name: Backend checks

on:
  push:
    branches:
      - develop/backend-foundation
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8

      - name: Django system checks
        run: python backend/manage.py check

      - name: Check migrations
        run: python backend/manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python backend/manage.py migrate

      - name: Import ingredients
        run: python backend/manage.py import_ingredients

      - name: Run Django tests
        run: python backend/manage.py test

      - name: Check PEP 8
        run: flake8 backend --config=setup.cfg
