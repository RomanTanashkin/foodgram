name: Foodgram CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8

      - name: Check Django project
        run: python backend/manage.py check

      - name: Check migrations
        run: python backend/manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python backend/manage.py migrate

      - name: Prepare API test data
        run: |
          python backend/manage.py import_ingredients
          python backend/manage.py shell -c "from recipes.models import Tag; [Tag.objects.get_or_create(name=name, slug=slug) for name, slug in [('Завтрак', 'breakfast'), ('Обед', 'lunch'), ('Ужин', 'dinner')]]"

      - name: Start API for Postman collection
        run: |
          python backend/manage.py runserver 127.0.0.1:8000 > /tmp/foodgram-django.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/api/tags/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/foodgram-django.log
          exit 1

      - name: Run provided Postman collection
        run: |
          npx --yes newman run postman_collection/foodgram.postman_collection.json \
            --env-var baseUrl=http://127.0.0.1:8000

      - name: Run Django tests
        run: python backend/manage.py test

      - name: Check PEP 8
        run: flake8 backend --config=setup.cfg

  build_and_push:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/foodgram_backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/foodgram_frontend:latest

  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Copy deployment files to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: 'docker-compose.production.yml,infra/nginx.conf,docs'
          target: foodgram

      - name: Deploy Foodgram
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            set -e
            cd ~/foodgram
            if [ ! -f .env ]; then
              echo 'Create ~/foodgram/.env before the first deployment.'
              exit 1
            fi
            docker compose -f docker-compose.production.yml pull
            docker compose -f docker-compose.production.yml down
            docker compose -f docker-compose.production.yml up -d
            for attempt in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:9001/api/tags/ > /dev/null; then
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                docker compose -f docker-compose.production.yml logs
                exit 1
              fi
              sleep 2
            done

            HOST='${{ secrets.HOST }}'
            sudo tee /etc/nginx/sites-available/foodgram > /dev/null <<EOF
            server {
                listen 80;
                server_name $HOST;

                location / {
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                    proxy_pass http://127.0.0.1:9001;
                }
            }
            EOF
            sudo ln -sfn \
              /etc/nginx/sites-available/foodgram \
              /etc/nginx/sites-enabled/foodgram
            sudo nginx -t
            sudo systemctl reload nginx
            curl -fsS -H "Host: $HOST" \
              http://127.0.0.1/api/tags/ > /dev/null
            docker image prune -f
