services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${DOCKERHUB_USERNAME}/foodgram_backend:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - static_data:/app/staticfiles/
      - media_data:/app/media/
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ${DOCKERHUB_USERNAME}/foodgram_frontend:latest
    volumes:
      - frontend_data:/app/result_build/

  nginx:
    image: nginx:1.25.4-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:9001:80'
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_data:/usr/share/nginx/html/:ro
      - static_data:/var/html/static/:ro
      - media_data:/var/html/media/:ro
      - ./docs/:/usr/share/nginx/docs/:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  static_data:
  media_data:
  frontend_data:
